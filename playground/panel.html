<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #1d1f24; --muted: #6b6f78;
    --line: #e2e0da; --accent: #3b7d4f; --accent-ink: #ffffff; --warn: #b5482f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171b; --card: #1e2127; --ink: #e8e8ea; --muted: #9a9ea8;
            --line: #2d3139; --accent: #6fbf84; --accent-ink: #0f1a12; --warn: #ef8a6f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent); }
  select, button { font: inherit; color: var(--ink); background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  select { width: 100%; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }
  .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .label { font-weight: 500; }
  .label small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4ch; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 0; height: 28px; }
  .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .seg button { flex: 1 1 auto; padding: 7px 10px; font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .buttons button { flex: 1; min-width: 120px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .error { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--warn);
           border: 1px solid var(--warn); border-radius: 8px; padding: 10px; margin-bottom: 14px; }
  .note { color: var(--muted); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
           background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<main>
  <header><span id="dot" class="dot"></span><h1>Playground</h1>
    <label class="toggle" title="For landscape scenes: turn the picture the other way up"><input type="checkbox" id="flip"> flip landscape</label>
    <label class="toggle"><input type="checkbox" id="fps"> fps</label></header>
  <select id="scene" aria-label="Scene"></select>
  <div id="error" class="error" hidden></div>
  <div class="card" id="params"></div>
  <div class="buttons">
    <button class="primary" id="save">Save as default</button>
    <button id="reset">Restart scene</button>
    <button id="defaults">Restore defaults</button>
    <button id="stop">Stop program</button>
  </div>
  <p class="note">↻ marks settings that restart the scene when changed. "Restart scene" also
    reloads the scene's code, so edits show up without stopping the program.</p>
</main>
<div id="toast" class="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
let current = null, pending = {}, timer = null;

async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1400);
}
function fmt(v, step) {
  const d = step >= 1 ? 0 : Math.min(3, (String(step).split(".")[1] || "").length);
  return Number(v).toFixed(d);
}
function flush() {               // batch slider moves into one request every 60 ms
  timer = null;
  const body = pending; pending = {};
  if (Object.keys(body).length) api("/api/params", body).catch(() => {});
}
function render(s) {
  current = s;
  $("scene").innerHTML = s.scenes.map(x =>
    `<option value="${x.name}" ${x.name === s.scene ? "selected" : ""}>${x.title}</option>`).join("");
  $("fps").checked = s.show_fps;
  $("flip").checked = s.flip_landscape;
  $("error").hidden = !s.error; $("error").textContent = s.error || "";
  const box = $("params"); box.innerHTML = "";
  if (!s.params.length) box.innerHTML = '<div class="row note">This scene has no settings.</div>';
  for (const p of s.params) {
    const row = document.createElement("div"); row.className = "row";
    if (p.choices && p.choices.length) {         // named options: a row of buttons
      row.innerHTML = `<div class="top"><span class="label">${p.label}${p.reset ? "<small>↻</small>" : ""}</span></div>
        <div class="seg">${p.choices.map((c, i) =>
          `<button data-i="${i}" class="${i === Math.round(p.value) ? "on" : ""}">${c}</button>`).join("")}</div>
        ${p.help ? `<div class="help">${p.help}</div>` : ""}`;
      row.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
        row.querySelectorAll(".seg button").forEach(o => o.classList.toggle("on", o === b));
        api("/api/params", { [p.name]: Number(b.dataset.i) });
      }));
      box.appendChild(row);
      continue;
    }
    row.innerHTML = `<div class="top"><span class="label">${p.label}${p.reset ? "<small>↻</small>" : ""}</span>
      <span class="val">${fmt(p.value, p.step)}</span></div>
      <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">
      ${p.help ? `<div class="help">${p.help}</div>` : ""}`;
    const input = row.querySelector("input"), val = row.querySelector(".val");
    input.addEventListener("input", () => {
      val.textContent = fmt(input.value, p.step);
      if (p.reset) return;                    // restart-type settings apply on release
      pending[p.name] = Number(input.value);
      if (!timer) timer = setTimeout(flush, 60);
    });
    input.addEventListener("change", () => {
      if (p.reset) api("/api/params", { [p.name]: Number(input.value) });
    });
    input.addEventListener("dblclick", () => {   // double-click a slider = its default
      input.value = p.default; input.dispatchEvent(new Event("input"));
      input.dispatchEvent(new Event("change"));
    });
    box.appendChild(row);
  }
}
async function load() {
  try { render(await api("/api/state")); $("dot").classList.add("ok"); }
  catch { $("dot").classList.remove("ok"); }
}
async function poll() {          // notice scene switches, errors, or a lost connection
  try {
    const s = await api("/api/state"); $("dot").classList.add("ok");
    if (!current || s.scene !== current.scene || s.error !== current.error ||
        s.params.length !== current.params.length) render(s);
  } catch { $("dot").classList.remove("ok"); }
}
$("scene").addEventListener("change", async (e) => {
  await api("/api/scene", { name: e.target.value });
  setTimeout(load, 400);
});
$("reset").onclick = async () => { await api("/api/reset", {}); toast("Scene restarted"); setTimeout(load, 400); };
$("defaults").onclick = async () => { await api("/api/defaults", {}); setTimeout(load, 300); toast("Defaults restored"); };
$("save").onclick = async () => { await api("/api/save", {}); toast("Saved as this scene's default"); };
$("fps").onchange = (e) => api("/api/fps", { on: e.target.checked });
$("flip").onchange = (e) => api("/api/flip", { on: e.target.checked });
$("stop").onclick = async () => {
  if (!confirm("Stop the program on the Pi? Start it again over SSH.")) return;
  await api("/api/quit", {}).catch(() => {}); toast("Stopped");
};
load(); setInterval(poll, 2500);
</script>
</body>
</html>
